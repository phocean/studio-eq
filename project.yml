name: StudioEQ
options:
  bundleIdPrefix: com.jcbaptiste
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
# Signing comes from Config/Signing.xcconfig (ad hoc by default, Config/Local.xcconfig if present).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  StudioEQ:
    type: application
    platform: macOS
    sources:
      - StudioEQ
    info:
      path: StudioEQ/Info.plist
      properties:
        CFBundleDisplayName: Studio EQ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAudioCaptureUsageDescription: "Studio EQ captures the audio sent to the Studio Display speakers to equalize it in real time. Nothing is recorded or transmitted."
        NSHumanReadableCopyright: "© 2026 Jean-Christophe Baptiste. Licensed under the GNU GPL v2 or later."
    entitlements:
      path: StudioEQ/StudioEQ.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jcbaptiste.StudioEQ
        PRODUCT_NAME: StudioEQ
        INFOPLIST_KEY_CFBundleDisplayName: Studio EQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Validation tools (SelfTest.swift, -TargetDeviceUID, -SimulateEngineFailure) exist only
        # in Debug. For measurements on optimized code, build Release with
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS=VALIDATION (see docs/ARCHITECTURE.md).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG VALIDATION"
        Release:
          # No debugger entitlement (get-task-allow) in Release: notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  StudioEQTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StudioEQTests
    dependencies:
      - target: StudioEQ
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StudioEQ.app/Contents/MacOS/StudioEQ"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StudioEQ:
    build:
      targets:
        StudioEQ: all
        StudioEQTests: [test]
    test:
      targets:
        - StudioEQTests
