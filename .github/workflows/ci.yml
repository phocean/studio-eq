# Unit tests and Release build on every push and pull request (ad hoc signing, no secrets).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Unit tests
        run: make test
      - name: Release build
        # The distributed configuration (no VALIDATION, optimized), ad hoc signed.
        run: make build
      - name: Logs
        if: failure()
        run: tail -100 build/test.log build/build.log 2>/dev/null || true
